[project]
name = "pricepilot"
version = "2.0.0"
description = "PricePilot v2 — API-first cart builder for Israeli supermarkets"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.49.0",
    "playwright-stealth",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
litellm = [
    "litellm>=1.40.0",
]

[project.scripts]
pricepilot-server = "pricepilot.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
